<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Basic HTML Page</title>
</head>
<body>

<script>

async function isURLUp(url) {
  try {
    const response = await fetch(url, { method: 'HEAD' });
    return response.ok;
  } catch (error) {
    return false;
  }
}


function redirectToApp() {
  // Example usage:
  const urlToCheck = 'capitalone://';

  isURLUp(urlToCheck)
    .then(isUp => {
      if (isUp) {
        alert(`${urlToCheck} is up.`);
      } else {
        alert(`${urlToCheck} is down or unreachable.`);
      }
    });
}

  const openAppLink = document.getElementById('openAppLink');

  openAppLink.addEventListener('click', (event) => {
    event.preventDefault(); // Prevent default browser behavior

    // Try to open the app with the deep link
    window.location.href = "capitalone://";

    // After a short delay, redirect to the Play Store if the app isn't installed
    setTimeout(() => {
      window.location.href = "https://www.redit.com";
    }, 500); // Adjust the timeout as needed
  });

  function checkAppInstalledMinimalImpact(appScheme) {
  return new Promise((resolve) => {
    // Flag for detection
    let appDetected = false;
    
    // Set up detection via blur event
    const handleBlur = () => {
      appDetected = true;
      clearTimeout(timeoutId);
      resolve(true);
    };
    
    // Listen for blur event (app taking focus)
    window.addEventListener('blur', handleBlur, { once: true });
    
    // Set timeout for detection failure
    const timeoutId = setTimeout(() => {
      window.removeEventListener('blur', handleBlur);
      resolve(false);
    }, 300);
    
    // Use hidden iframe instead of direct navigation
    const iframe = document.createElement('iframe');
    iframe.style.width = '1px';
    iframe.style.height = '1px';
    iframe.style.position = 'absolute';
    iframe.style.top = '-100px';
    iframe.style.visibility = 'hidden';
    iframe.src = appScheme;
    document.body.appendChild(iframe);
    
    // Remove iframe quickly
    setTimeout(() => {
      document.body.removeChild(iframe);
    }, 100);
  });
}

// Usage
document.getElementById('check-button').addEventListener('click', async () => {
  const isInstalled = await checkAppInstalledMinimalImpact('capitalone://');
  localStorage.setItem('appInstalled', isInstalled ? 'true' : 'false');
  alert(`App installed: ${isInstalled}`);
});

</script>

  <h1>Hello World</h1>
  <p>This is a basic HTML page.</p>
  <a id="openAppLink" href="capitalone://">Open App</a>
  <button onclick="redirectToApp()" style="border: 8px solid blue;">redirectToApp</button>

</body>
</html>
