<script>
  function checkAppInstalled(appScheme, appStoreUrl, playStoreUrl) {
  // Current timestamp to measure elapsed time
  const startTime = Date.now();
  
  // Time threshold to determine if app opened (in milliseconds)
  const timeThreshold = 500;
  
  // Detect platform to use the appropriate store link
  const isAndroid = /Android/i.test(navigator.userAgent);
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const storeUrl = isAndroid ? playStoreUrl : isIOS ? appStoreUrl : appStoreUrl;
  
  // Set up detection for when user returns to the browser
  let isAppDetectionComplete = false;
  
  // Handle visibility change (user returns to browser)
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && !isAppDetectionComplete) {
      // User returned to browser quickly, app likely opened
      clearTimeout(redirectTimeout);
      isAppDetectionComplete = true;
      alert('App appears to be installed');
    }
  });
  
  // Alternative detection method for some browsers
  window.addEventListener('pagehide', function() {
    if (!isAppDetectionComplete) {
      clearTimeout(redirectTimeout);
      isAppDetectionComplete = true;
    }
  });
  
  // For modern browsers that support blur
  window.addEventListener('blur', function() {
    if (!isAppDetectionComplete) {
      clearTimeout(redirectTimeout);
      isAppDetectionComplete = true;
      alert('App appears to be installed (window blurred)');
    }
  });
  
  // Set timeout for fallback
  const redirectTimeout = setTimeout(function() {
    if (!isAppDetectionComplete) {
      isAppDetectionComplete = true;
      alert('Evan : App not installed, redirecting to store');
      // window.location.href = storeUrl;
    }
  }, timeThreshold);

  // const testMode = false;
  // if (testMode) {
  //   console.log('Would redirect to store');
  // } else {
  //   window.location.href = storeUrl;
  // }
  
  // Try to open the app
  // window.location.href = appScheme;
}

// Example usage:

  checkAppInstalled(
    'myapp://open', 
    'capitalone://', 
    'https://play.google.com/store/apps/details?id=com.example.myapp'
  );
}
</script>
