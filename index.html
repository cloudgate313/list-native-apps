<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Basic HTML Page</title>
</head>
<body>
  <script>
    function setUrlLocation() {
        window.location = "capitalone://";
   }
   function setUrlLocationP(e) {
        e.preventDefault();
        window.location = "capitalone://";
        console.log("Evan : prevent called : e : ", e);
   }
 </script>

  <h1>Hello World</h1>
  <p>This is a basic HTML page.</p>
  <a href="capitalone://">Open Ease App</a>
  <a onclick="setUrlLocationP(event)" href="javascript:void(0)">preventDefault</a>
  <button onclick="setUrlLocation()" style="border: 1px solid orangered;">Open Ease</button>
</body>
</html>
