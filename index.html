<script>
function checkAndFlagAppInstalled(appScheme) {
  // Create storage for our flag
  const setAppInstalledFlag = () => {
    localStorage.setItem('appInstalled', 'true');
    alert('App detected and flag set!');
  };
  
  // Set up detection via blur (app opening takes focus from browser)
  const blurHandler = () => {
    setAppInstalledFlag();
  };
  
  // Set up detection via visibility change (user returns to browser)
  const visibilityHandler = () => {
    if (!document.hidden) {
      setAppInstalledFlag();
      window.removeEventListener('blur', blurHandler);
      document.removeEventListener('visibilitychange', visibilityHandler);
    }
  };
  
  // Add our event listeners
  window.addEventListener('blur', blurHandler, { once: true });
  document.addEventListener('visibilitychange', visibilityHandler);
  
  // Set timeout to remove listeners if app isn't installed
  setTimeout(() => {
    window.removeEventListener('blur', blurHandler);
    document.removeEventListener('visibilitychange', visibilityHandler);
    alert('App detection complete (not installed)');
  }, 500);
  
  // Try to open the app using an iframe to minimize disruption
  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = appScheme;
  document.body.appendChild(iframe);
  
  // Remove the iframe after a short time
  setTimeout(() => {
    document.body.removeChild(iframe);
  }, 100);
}

// Usage (must be triggered by user interaction)
document.getElementById('check-app-button').addEventListener('click', () => {
  checkAndFlagAppInstalled('capitalone://');
});

// Later, you can check the flag:
function isAppInstalled() {
  return localStorage.getItem('appInstalled') === 'true';
}
</script>
