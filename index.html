<script>

async function isURLUp(url) {
  try {
    const response = await fetch(url, { method: 'HEAD' });
    return response.ok;
  } catch (error) {
    return false;
  }
}


function redirectToApp() {
  // Example usage:
  const urlToCheck = 'capitalone://';

  isURLUp(urlToCheck)
    .then(isUp => {
      if (isUp) {
        alert(`${urlToCheck} is up.`);
      } else {
        alert(`${urlToCheck} is down or unreachable.`);
      }
    });
}
