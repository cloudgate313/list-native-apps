<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Basic HTML Page</title>
</head>
<body>

<script>
  function redirectToApp() {
    let fallbackLink = 'https://yourapp.com/download';

    // isiOS isAndroid implement by yourself
    if (isiOS() || isAndroid()) {
        window.location = 'capitalone://';

        const androidAppStoreLink = 'https://play.google.com/store/apps';
        const iosAppStoreLink = 'https://apps.apple.com/us';
        fallbackLink = isAndroid() ? androidAppStoreLink : iosAppStoreLink;
        // setTimeout still executes after the app is opened, so the current page will navigate to the fallback link
        // to prevent this, I use the document.hasFocus function to check
        setTimeout(function () {
            // if the app is opened, the document won't be focused
            // so if app is not installed, the document will be focused

            const message = document.hasFocus() ? 'App is not installed' : 'App is installed';
            alert(message);

            // if (document.hasFocus()) {
            //     alert('App is not installed');
            //     // window.location = fallbackLink;
            // }
        }, 1000);
    }
}

</script>

  <h1>Hello World</h1>
  <p>This is a basic HTML page.</p>
  <button onclick="redirectToApp()">redirectToApp</button>


</body>
</html>
